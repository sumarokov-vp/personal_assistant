# Бот живёт на Mac mini (arm64) в colima. Запуск — deploy/up.sh: он достаёт секреты из pass
# и передаёт их переменными шелла, в файлы они не пишутся.
#
#  * network_mode: host не используется — «host» в colima это Linux-VM, а не сам mac,
#    postgres и redis достижимы по именам в общей внешней сети infra.
#  * Движок — ClaudeSdkProvider ai_framework (Provider.CLAUDE_SDK) по подписке:
#    CLAUDE_CODE_OAUTH_TOKEN, ключа Claude API нет. Встроенные инструменты CLI выключены
#    managed settings в образе, у модели только инструменты бота. Сессии CLI живут в $HOME
#    контейнера и пропадают с ним.
#  * Вики: копия obsidian_wiki — том ~/docker/personal_assistant/wiki (первый clone на пустом
#    томе делает сам бот). Deploy-ключ вики up.sh кладёт файлом 0600 в
#    ~/docker/personal_assistant/secrets/ (вне тома вики и вне репо), сюда он монтируется
#    только на чтение.
#  * Вложения (фото, PDF) — в DO Spaces: бакет и ключ из pass-записи spaces-attachments,
#    up.sh разбирает её в ATTACHMENTS_S3_*. На диск бота вложения не пишутся.
#  * Dropbox: ~/Dropbox хоста (синхронизирует Maestral) — том /dropbox, запись разрешена
#    (colima отдаёт $HOME через virtiofs, файл ложится на хост под владельцем). Закрытые папки
#    перекрыты пустым каталогом ~/docker/personal_assistant/empty только на чтение — их
#    содержимое в контейнер не попадает вовсе: Vault, 01_work, 03_home/07_ecp/egov.kz (ключи
#    ЭЦП и пароль). Новая чувствительная папка в корне Dropbox видна боту, пока её не добавят
#    сюда; vault_selftest_* меняют имена — их отсекает код инструментов Dropbox.
#  * Todoist и Gmail: TODOIST_TOKEN и GMAIL_* из pass. GMAIL_CLIENT_ID/SECRET up.sh достаёт из
#    JSON OAuth-клиента (installed.client_id/client_secret), refresh token — отдельная запись.
#  * OWNER_TELEGRAM_ID — из pass owner-telegram-id: бот слышит только владельца в личном чате,
#    остальные апдейты отбрасывает до базы и обработчиков.
name: personal_assistant

services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: personal_assistant-bot:latest
    container_name: personal_assistant_bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?}
      BOT_DB_URL: ${BOT_DB_URL:?}
      AI_DB_URL: ${AI_DB_URL:?}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5}
      VOICE_RECOGNITION_API_KEY: ${VOICE_RECOGNITION_API_KEY:?}
      REDIS_URL: redis://redis:6379/4
      VOICE_RECOGNITION_URL: http://10.72.0.199:8000
      OWNER_TIMEZONE: ${OWNER_TIMEZONE:-Asia/Almaty}
      LOG_LEVEL: INFO
      WIKI_DIR: /wiki/obsidian_wiki
      WIKI_REMOTE_URL: ${WIKI_REMOTE_URL:-git@github.com:sumarokov-vp/obsidian_wiki.git}
      WIKI_SSH_KEY_PATH: /run/secrets/wiki_deploy_key
      ATTACHMENTS_S3_ENDPOINT: ${ATTACHMENTS_S3_ENDPOINT:?}
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:?}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:?}
      ATTACHMENTS_S3_ACCESS_KEY: ${ATTACHMENTS_S3_ACCESS_KEY:?}
      ATTACHMENTS_S3_SECRET_KEY: ${ATTACHMENTS_S3_SECRET_KEY:?}
      DROPBOX_ROOT: /dropbox
      TODOIST_TOKEN: ${TODOIST_TOKEN:?}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:?}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:?}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:?}
    volumes:
      - ${PA_DATA_DIR:?}/wiki:/wiki
      - ${WIKI_DEPLOY_KEY_FILE:?}:/run/secrets/wiki_deploy_key:ro
      - ${DROPBOX_DIR:?}:/dropbox
      # Пустые заглушки поверх закрытых папок; docker монтирует родителя раньше вложенных
      - ${PA_DATA_DIR:?}/empty:/dropbox/Vault:ro
      - ${PA_DATA_DIR:?}/empty:/dropbox/01_work:ro
      - ${PA_DATA_DIR:?}/empty:/dropbox/03_home/07_ecp/egov.kz:ro

networks:
  default:
    name: infra
    external: true
