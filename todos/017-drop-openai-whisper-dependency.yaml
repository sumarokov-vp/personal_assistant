title: Сделать openai-whisper опциональной зависимостью (нативный транскрайбер остаётся в коде)
status: done
created_at: 23.06.2026
completed_at: 21.08.2026

description: |
  Бот работает через HTTP-сервис распознавания речи (faster-whisper, GPU) —
  src/voice_recognition/http_transcriber.py. Нативная реализация на openai-whisper
  остаётся в репозитории как альтернативный подключаемый путь.

  Решение пользователя (21.08.2026): нативный код НЕ удаляем. Вместо полного
  выпиливания openai-whisper переведён в опциональный extra, а выбор транскрайбера
  вынесен в переменную окружения.

  СДЕЛАНО (23.06.2026): openai-whisper перенесён из [project].dependencies в
  [dependency-groups].dev — пакет перестал попадать в Docker-образ, но продолжал
  ставиться локально при uv sync (torch + CUDA + triton + numba, ~7 GiB в .venv).

  СДЕЛАНО (21.08.2026):
  1. openai-whisper перенесён из [dependency-groups].dev в
     [project.optional-dependencies].whisper — uv sync его больше не ставит.
     Ставится явно: uv sync --extra whisper.
  2. src/voice_recognition/transcriber.py (функция transcribe) заменён на
     src/voice_recognition/native_transcriber.py — класс NativeTranscriber,
     удовлетворяющий ITranscriber, с ленивым импортом whisper через
     importlib.import_module. Импорт модуля не падает без установленного пакета,
     type: ignore больше не нужен.
  3. Выбор транскрайбера — workers/bot/transcriber_factory.py, режим из
     VOICE_RECOGNITION_MODE (http | native, дефолт http), модель — WHISPER_MODEL.
     Режим native без установленного пакета падает на старте с подсказкой.
  4. .venv: 7.4 GiB -> 413 MiB. mypy, pyright, ruff, lint-imports, pytest зелёные
     без установленного whisper.

recommendation: |
  Задача закрыта. Полное удаление нативной реализации не планируется —
  она подключается через extra. Если когда-нибудь понадобится выпилить совсем:
  удалить src/voice_recognition/native_transcriber.py, ветку native в
  transcriber_factory.py и секцию [project.optional-dependencies].
